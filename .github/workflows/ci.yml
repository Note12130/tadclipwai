name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Typecheck, Guard & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Zero-Upload Guard Check
        run: npm run check:guard

      - name: Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test

      - name: Run Performance Regression Guard
        run: npm run check:perf

      - name: Build production bundle
        run: npm run build
