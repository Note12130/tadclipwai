<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Squircle Background -->
  <rect width="512" height="512" rx="112" fill="#4F46E5" />
  
  <!-- Film Strip Accent -->
  <rect x="76" y="76" width="360" height="360" rx="44" fill="#3730A3" opacity="0.5" stroke="#818CF8" stroke-width="12" stroke-dasharray="24 16" />
  
  <!-- Modern Precision Scissor Icon -->
  <g transform="translate(256, 256) rotate(-35) translate(-256, -256)" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Blade -->
    <path d="M155 165 L375 256" stroke-width="34" />
    <!-- Bottom Blade -->
    <path d="M155 347 L375 256" stroke-width="34" />
    
    <!-- Top Handle Loop -->
    <circle cx="145" cy="155" r="48" fill="#4F46E5" stroke="#FFFFFF" stroke-width="30" />
    
    <!-- Bottom Handle Loop -->
    <circle cx="145" cy="357" r="48" fill="#4F46E5" stroke="#FFFFFF" stroke-width="30" />
    
    <!-- Center Pivot Pin -->
    <circle cx="282" cy="256" r="16" fill="#FFFFFF" stroke="none" />
  </g>
  
  <!-- Fast Video Play Badge (Bottom Right) -->
  <circle cx="396" cy="396" r="64" fill="#10B981" stroke="#0B0F19" stroke-width="10" />
  <polygon points="384,372 420,396 384,420" fill="#FFFFFF" />
</svg>
